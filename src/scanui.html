<!-- shared dim behind any bottom sheet -->
<div id="sheetbg" onclick="closeBurn();closeManual();"></div>
<div class="sheet" id="burnsheet"><div class="sheet-in" id="burn-body"></div></div>
<div class="sheet" id="mansheet"><div class="sheet-in" id="man-body"></div></div>

<!-- full-screen scanner: the live camera, three modes, one shutter -->
<div id="scan" data-mode="meal">
  <video id="scan-video" playsinline muted autoplay></video>
  <img id="scan-prev" alt="">
  <div class="sc-shade"></div>
  <div class="sc-top">
    <button class="sc-btn" onclick="closeScan()" aria-label="Close">✕</button>
    <div class="sc-title">Meal Scanner</div>
    <button class="sc-btn" id="scan-torch" hidden onclick="scanTorch()" aria-label="Flash">⚡</button>
  </div>
  <div class="sc-frame" id="scan-frame">
    <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    <div class="line"></div>
  </div>
  <div class="sc-hint" id="scan-hint">Point at your plate, from above</div>
  <div id="scan-pct"></div>
  <div class="sc-bottom">
    <div class="sc-modes" id="scan-modes"></div>
    <div class="sc-ctrl">
      <button class="sc-side" onclick="pickPhoto(false)" aria-label="Choose from photos">🖼</button>
      <button class="sc-shut" id="scan-shut" onclick="scanShoot()" aria-label="Scan"><i></i></button>
      <button class="sc-side" onclick="scanTypeCode()" aria-label="Type a barcode number" id="scan-typebtn">123</button>
    </div>
    <div class="sc-code" id="scan-code" hidden>
      <input id="scan-code-in" inputmode="numeric" placeholder="Number under the barcode" aria-label="Barcode number"
        onkeydown="if(event.key==='Enter')scanCodeGo()"><button onclick="scanCodeGo()">Find</button>
    </div>
    <div class="sc-left" id="scan-left"></div>
    <div class="sc-tips">From above · the whole plate in view · a spoon beside it for size</div>
    <div id="scan-err"></div>
  </div>
  <div class="sheet" id="scan-sheet"></div>
</div>
