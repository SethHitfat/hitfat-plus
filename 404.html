<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>HITFAT+ · Tiada di sini</title>
<!-- Netlify serves this for any path that is not a file, and _redirects
     points /src/* here on purpose so the build sources are not readable.
     Until this file existed that rule landed on Netlify's own grey page,
     which is a stranger's page on our domain. -->
<style>
  :root{ color-scheme:dark; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0b0b0d; color:#f4f4f5; padding:24px;
    font:16px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
    text-align:center;
  }
  .wrap{ max-width:360px; }
  img{ width:64px; height:auto; opacity:.9; margin-bottom:26px; }
  h1{ margin:0 0 10px; font-size:22px; font-weight:800; letter-spacing:.02em; }
  p{ margin:0 0 26px; color:#a1a1aa; font-size:15px; }
  a{
    display:inline-block; padding:13px 30px; border-radius:11px;
    background:#e11d2e; color:#fff; font-weight:700; text-decoration:none;
  }
  a:active{ transform:translateY(1px); }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/hfplus-logo.png" alt="HITFAT+">
    <h1>Tiada di sini</h1>
    <p>Halaman ini tak wujud, atau dah berpindah.</p>
    <a href="/">Buka HITFAT+</a>
  </div>
</body>
</html>
